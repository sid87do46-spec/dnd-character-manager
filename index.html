<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171923"><title>D&D Character Manager</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eee;background:#11131b}*{box-sizing:border-box}body{margin:0}header{background:#202331;border-bottom:2px solid #b99551;padding:15px;position:sticky;top:0;z-index:2}h1{font-size:20px;margin:0;color:#e9c982}h2{font-size:18px;color:#e9c982}small,.muted{color:#aaa}main{max-width:960px;margin:auto;padding:14px 14px 80px}nav{display:flex;gap:5px;overflow-x:auto;padding:10px 0}button,.btn{background:#34394c;color:white;border:1px solid #5b6071;border-radius:9px;padding:10px 13px;cursor:pointer}button.active,.primary{background:#8c632d;border-color:#d5aa63}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #e9c982}input,select,textarea{width:100%;background:#222635;color:#fff;border:1px solid #545a69;border-radius:8px;padding:10px;font:inherit}label{display:block;font-size:13px;color:#d6d1c6;margin:7px 0 4px}.card{background:#1d202c;border:1px solid #3c4050;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.stat{text-align:center;border:1px solid #4b4d56;border-radius:9px;padding:10px}.stat strong{font-size:25px;color:#e9c982}.pill{display:inline-block;background:#373b4a;border-radius:15px;padding:4px 9px;font-size:12px}.hidden{display:none}.danger{background:#77363b}.success{background:#35624b}.entry{border-bottom:1px solid #414554;padding:10px 0}.entry:last-child{border:0}.wide{width:100%}.notice{background:#39311f;padding:10px;border-radius:8px;color:#f2d9a0}#toast{position:fixed;bottom:10px;left:10px;right:10px;background:#3b563e;padding:12px;border-radius:9px;display:none;z-index:4}pre{white-space:pre-wrap;word-break:break-word}a{color:#f2ce8b}</style></head><body><header><h1>⚔ D&D Character Manager</h1><small>D&D 5e · 2014 · Prototipo v0.4</small></header><main><div class="row"><select id="characterSelect" aria-label="Personaggio"></select><button onclick="addCharacter()">+ Personaggio</button><button onclick="deleteCharacter()" class="danger">Elimina</button></div><nav id="tabs"></nav><section id="view"></section><p class="muted">I dati sono salvati in questo browser. Esporta periodicamente un backup JSON.</p></main><div id="toast" role="status"></div><script>
const KEY='dndcm_v01';const AB=['for','des','cos','int','sag','car'];const NAMES=['Forza','Destrezza','Costituzione','Intelligenza','Saggezza','Carisma'];const SKILLS=[['Acrobazia','des'],['Addestrare Animali','sag'],['Arcano','int'],['Atletica','for'],['Furtività','des'],['Indagare','int'],['Inganno','car'],['Intimidire','car'],['Intrattenere','car'],['Intuizione','sag'],['Medicina','sag'],['Natura','int'],['Percezione','sag'],['Persuasione','car'],['Rapidità di Mano','des'],['Religione','int'],['Sopravvivenza','sag'],['Storia','int']];const TABS=['Scheda','Combattimento','Dadi','Magia','Inventario','Diario','Progressione','Dati'];let tab='Scheda';let state;
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);function fresh(name='Nuovo eroe'){return{id:uid(),name,cls:'Guerriero',race:'Umano',level:1,xp:0,background:'',alignment:'',abilities:{for:15,des:13,cos:14,int:10,sag:12,car:8},proficiencies:[],expertise:[],saves:['for','cos'],hp:12,maxHp:12,tempHp:0,ac:16,speed:9,hitDiceUsed:0,deathSuccess:0,deathFail:0,conditions:'',resources:[],attacks:[],spells:[],slots:{},inventory:[],coins:{mo:0,ma:0,mr:0},notes:'',history:[]}}function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.characters)&&v.characters.length)return v}catch(e){}return{characters:[fresh('Il mio eroe')],selected:null}}state=load();if(!state.selected||!state.characters.some(c=>c.id===state.selected))state.selected=state.characters[0].id;function ch(){return state.characters.find(c=>c.id===state.selected)}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Salvataggio non riuscito: esporta i dati')}}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2300)}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function mod(n){return Math.floor((Number(n)-10)/2)}function fmt(n){return n>=0?'+'+n:String(n)}function prof(c){return Math.ceil(c.level/4)+1}function roll(n,s){let a=[];for(let i=0;i<n;i++)a.push(1+Math.floor(Math.random()*s));return a}function history(s){ch().history.unshift(new Date().toLocaleTimeString('it-IT')+' · '+s);ch().history=ch().history.slice(0,60);save();toast(s)}function field(label,key,type='text'){return `<div><label>${label}</label><input ${type==='number'?'type="number"':'type="text"'} data-key="${key}" value="${esc(ch()[key])}"></div>`}function update(k,v){let c=ch();if(['level','xp','hp','maxHp','tempHp','ac','speed','hitDiceUsed','deathSuccess','deathFail'].includes(k))v=Number(v)||0;if(k==='level')v=Math.max(1,Math.min(20,v));c[k]=v;save();if(['level','name'].includes(k))render()}function updateAbility(k,v){ch().abilities[k]=Math.max(1,Math.min(30,Number(v)||1));save();render()}function toggleExpertise(k){let c=ch();c.expertise ||= [];if(!c.proficiencies.includes(k)){toast('Prima seleziona la competenza');return}if(c.expertise.includes(k))c.expertise=c.expertise.filter(x=>x!==k);else c.expertise.push(k);save();render()}function toggleProf(k,group){let c=ch();let a=group==='save'?c.saves:c.proficiencies;if(a.includes(k))a.splice(a.indexOf(k),1);else a.push(k);if(group==='skill'&&!a.includes(k))c.expertise=(c.expertise||[]).filter(x=>x!==k);save();render()}function render(){let c=ch();document.getElementById('characterSelect').innerHTML=state.characters.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('');document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');let html='';if(tab==='Scheda')html=sheet(c);if(tab==='Combattimento')html=combat(c)+fighterPanel(c);if(tab==='Dadi')html=dice(c);if(tab==='Magia')html=magic(c)+spellOptions(c);if(tab==='Inventario')html=inventory(c);if(tab==='Diario')html=diary(c);if(tab==='Progressione')html=progression(c);if(tab==='Dati')html=dataPage();document.getElementById('view').innerHTML=html;document.querySelectorAll('[data-key]').forEach(e=>e.addEventListener('change',()=>update(e.dataset.key,e.value)));document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;render()});}
function sheet(c){return `<div class="card"><h2>Identità</h2><div class="grid">${field('Nome','name')}${field('Classe','cls')}${field('Razza','race')}${field('Livello','level','number')}${field('Esperienza','xp','number')}${field('Background','background')}${field('Allineamento','alignment')}</div></div><div class="card"><h2>Caratteristiche</h2><div class="grid">${AB.map((k,i)=>`<div class="stat"><label>${NAMES[i]}</label><input aria-label="${NAMES[i]}" type="number" min="1" max="30" value="${c.abilities[k]}" onchange="updateAbility('${k}',this.value)"><strong>${fmt(mod(c.abilities[k]))}</strong></div>`).join('')}</div><p>Bonus competenza: <strong>${fmt(prof(c))}</strong> · Iniziativa: <strong>${fmt(mod(c.abilities.des))}</strong></p></div><div class="card"><h2>Tiri salvezza</h2><div class="grid">${AB.map((k,i)=>`<label><input style="width:auto" type="checkbox" ${c.saves.includes(k)?'checked':''} onchange="toggleProf('${k}','save')"> ${NAMES[i]} <b>${fmt(mod(c.abilities[k])+(c.saves.includes(k)?prof(c):0))}</b></label>`).join('')}</div></div><div class="card"><h2>Abilità</h2><p class="muted">Spunta competenza e, se prevista dalla classe, maestria (doppio bonus competenza).</p><div class="grid">${SKILLS.map(([n,k])=>`<label><input style="width:auto" type="checkbox" ${c.proficiencies.includes(n)?'checked':''} onchange="toggleProf('${esc(n)}','skill')"> ${n} (${k.toUpperCase()}) <b>${fmt(mod(c.abilities[k])+(c.proficiencies.includes(n)?prof(c)*(c.expertise?.includes(n)?2:1):0))}</b> <input style="width:auto" type="checkbox" aria-label="Maestria ${n}" title="Maestria: doppia competenza" ${c.expertise?.includes(n)?'checked':''} onchange="toggleExpertise('${esc(n)}')"> Maestria</label>`).join('')}</div></div>`}
function combat(c){return `<div class="card"><h2>Combattimento</h2><div class="grid">${field('CA','ac','number')}${field('Velocità (m)','speed','number')}${field('PF massimi','maxHp','number')}${field('PF attuali','hp','number')}${field('PF temporanei','tempHp','number')}${field('Dadi Vita usati','hitDiceUsed','number')}</div><p class="pill">PF: ${c.hp}/${c.maxHp} (+${c.tempHp} temporanei)</p><label>Quantità</label><input type="number" min="1" id="hpAmount" value="5"><div class="row" style="margin-top:9px"><button class="danger" onclick="changeHp('damage')">Danni</button><button class="success" onclick="changeHp('heal')">Cura</button><button onclick="shortRest()">Riposo breve</button><button onclick="longRest()">Riposo lungo</button></div><p class="muted">Il riposo breve permette di spendere Dadi Vita; il riposo lungo ripristina PF e parte dei Dadi Vita.</p>${field('Condizioni (testo libero)','conditions')}</div><div class="card"><h2>Attacchi</h2><div class="grid"><input id="atkName" placeholder="Nome arma"><input id="atkBonus" type="number" placeholder="Bonus al colpire"><input id="atkDamage" placeholder="Danno, es. 1d8+3"></div><button onclick="addAttack()">Aggiungi attacco</button>${c.attacks.map((a,i)=>`<div class="entry"><b>${esc(a.name)}</b> · ${fmt(a.bonus)} · ${esc(a.damage)}<div class="row"><button onclick="attack(${i},'normal')">Attacca</button><button onclick="attack(${i},'adv')">Vantaggio</button><button onclick="attack(${i},'dis')">Svantaggio</button><button onclick="removeItem('attacks',${i})">Rimuovi</button></div></div>`).join('')}</div><div class="card"><h2>Risorse</h2><div class="grid"><input id="resName" placeholder="Risorsa, es. Azione Impetuosa"><input id="resMax" type="number" placeholder="Utilizzi massimi"><select id="resRecovery"><option value="long">Recupero: riposo lungo</option><option value="short">Recupero: riposo breve</option><option value="manual">Recupero manuale</option></select></div><button onclick="addResource()">Aggiungi risorsa</button>${c.resources.map((r,i)=>`<div class="entry"><b>${esc(r.name)}</b> ${r.current}/${r.max} · ${r.recovery==='short'?'riposo breve':r.recovery==='manual'?'manuale':'riposo lungo'} <button onclick="useResource(${i},-1)">−</button> <button onclick="useResource(${i},1)">+</button> <button onclick="removeItem('resources',${i})">Elimina</button></div>`).join('')}</div><div class="card"><h2>Tiri salvezza contro morte</h2><div class="grid">${field('Successi','deathSuccess','number')}${field('Fallimenti','deathFail','number')}</div><button onclick="deathSave()">Tira d20</button><button onclick="resetDeath()">Azzera</button></div>`}
function dice(){return `<div class="card"><h2>Lancia dadi</h2><div class="grid"><div><label>Numero dadi</label><input type="number" id="numDice" value="1" min="1" max="100"></div><div><label>Tipo dado</label><select id="dieSides">${[4,6,8,10,12,20,100].map(n=>`<option value="${n}" ${n===20?'selected':''}>d${n}</option>`).join('')}</select></div><div><label>Modificatore</label><input type="number" id="diceMod" value="0"></div><div><label>Modalità d20</label><select id="adv"><option value="normal">Normale</option><option value="adv">Vantaggio</option><option value="dis">Svantaggio</option></select></div></div><button class="primary wide" onclick="throwDice()" style="margin-top:12px">Lancia</button><p id="diceResult" aria-live="polite"></p></div><div class="card"><h2>Storico recente</h2>${ch().history.slice(0,12).map(x=>`<div class="entry">${esc(x)}</div>`).join('')}</div>`}
function magic(c){return `<div class="card"><h2>Slot incantesimo</h2><div class="grid">${Array.from({length:9},(_,i)=>{let k=i+1,s=c.slots[k]||{current:0,max:0};return `<div><label>Livello ${k}</label><input type="number" min="0" aria-label="Slot livello ${k} attuali" value="${s.current}" onchange="slot(${k},'current',this.value)"><small>di</small><input type="number" min="0" aria-label="Slot livello ${k} massimi" value="${s.max}" onchange="slot(${k},'max',this.value)"></div>`}).join('')}</div></div><div class="card"><h2>Incantesimi</h2><div class="grid"><input id="spellName" placeholder="Nome incantesimo"><input id="spellLevel" type="number" min="0" max="9" placeholder="Livello (0-9)"><input id="spellDesc" placeholder="Descrizione personale"></div><button onclick="addSpell()">Aggiungi</button>${c.spells.map((s,i)=>`<div class="entry"><b>${esc(s.name)}</b> · Liv. ${s.level}<p>${esc(s.desc)}</p><button onclick="castSpell(${i})">Lancia</button> <button onclick="removeItem('spells',${i})">Rimuovi</button></div>`).join('')}</div>`}
function inventory(c){return `<div class="card"><h2>Monete</h2><div class="grid">${['mo','ma','mr'].map(k=>`<div><label>${k.toUpperCase()}</label><input type="number" value="${c.coins[k]||0}" onchange="ch().coins.${k}=Number(this.value)||0;save()"></div>`).join('')}</div></div><div class="card"><h2>Inventario</h2><div class="grid"><input id="itemName" placeholder="Oggetto"><input id="itemQty" type="number" value="1" min="1"></div><button onclick="addInventory()">Aggiungi oggetto</button>${c.inventory.map((x,i)=>`<div class="entry">${esc(x.name)} × ${x.qty} <button onclick="removeItem('inventory',${i})">Rimuovi</button></div>`).join('')}</div>`}
function diary(c){return `<div class="card"><h2>Diario del personaggio</h2><textarea rows="12" id="notes">${esc(c.notes)}</textarea><button onclick="ch().notes=document.getElementById('notes').value;save();toast('Diario salvato')">Salva diario</button></div><div class="card"><h2>Registro attività</h2>${c.history.map(x=>`<div class="entry">${esc(x)}</div>`).join('')}</div>`}
function dataPage(){return `<div class="card"><h2>Backup e trasferimento</h2><p>Esporta tutti i personaggi e reimportali su un altro dispositivo. Il file JSON contiene le informazioni dei personaggi.</p><button onclick="exportJson()">Esporta JSON</button><label>Importa JSON</label><input type="file" id="importFile" accept=".json,application/json" onchange="importJson(this)"><button onclick="window.print()">Stampa / Salva PDF</button></div><div class="notice">Versione 0.3: progressione, capacità del Guerriero e concentrazione. Attacchi con vantaggio/svantaggio e critici, maestria nelle abilità e recupero configurabile delle risorse. Il motore non automatizza ancora tutte le regole D&D 2014.</div>`}
function addCharacter(){let name=prompt('Nome del nuovo personaggio:','Nuovo eroe');if(name===null)return;let c=fresh(name.trim()||'Nuovo eroe');state.characters.push(c);state.selected=c.id;save();render()}function deleteCharacter(){if(state.characters.length===1){toast('Deve restare almeno un personaggio');return}if(!confirm('Eliminare questo personaggio?'))return;state.characters=state.characters.filter(x=>x.id!==state.selected);state.selected=state.characters[0].id;save();render()}document.getElementById('characterSelect').onchange=e=>{state.selected=e.target.value;save();render()};function changeHp(kind){let c=ch(),n=Math.max(0,Number(document.getElementById('hpAmount').value)||0);if(kind==='damage'){let t=Math.min(c.tempHp,n);c.tempHp-=t;c.hp=Math.max(0,c.hp-(n-t))}else c.hp=Math.min(c.maxHp,c.hp+n);history((kind==='damage'?'Danni ':'Cura ')+n);render()}
function shortRest(){let c=ch(),remaining=Math.max(0,c.level-c.hitDiceUsed);if(!remaining){c.resources.forEach(r=>{if(r.recovery==='short')r.current=r.max});history('Riposo breve: risorse recuperate, nessun Dado Vita disponibile');render();return}let n=Number(prompt(`Quanti Dadi Vita spendere? Disponibili: ${remaining}`,1));if(!Number.isInteger(n)||n<1||n>remaining)return;let sides=Number(prompt('Taglia del Dado Vita (es. 10 per Guerriero)',10));if(![6,8,10,12].includes(sides))return;let dice=roll(n,sides),heal=Math.max(0,dice.reduce((a,b)=>a+b,0)+n*mod(c.abilities.cos));c.resources.forEach(r=>{if(r.recovery==='short')r.current=r.max});c.hitDiceUsed+=n;c.hp=Math.min(c.maxHp,c.hp+heal);history(`Riposo breve: ${dice.join('+')} + COS, recuperati ${heal} PF`);render()}function longRest(){let c=ch();c.hp=c.maxHp;c.hitDiceUsed=Math.max(0,c.hitDiceUsed-Math.max(1,Math.floor(c.level/2)));c.slots=Object.fromEntries(Object.entries(c.slots).map(([k,v])=>[k,{...v,current:v.max}]));c.resources.forEach(r=>{if(r.recovery!=='manual')r.current=r.max});history('Riposo lungo: PF, slot e risorse ripristinati (risorse configurate manualmente)');render()}
function addAttack(){let name=document.getElementById('atkName').value.trim(),bonus=Number(document.getElementById('atkBonus').value)||0,damage=document.getElementById('atkDamage').value.trim();if(!name||!/^\d+d(?:4|6|8|10|12|20|100)(?:[+-]\d+)?$/i.test(damage)){toast('Inserisci nome e danno tipo 1d8+3');return}ch().attacks.push({name,bonus,damage});save();render()}function evalDamage(s){let m=s.match(/^(\d+)d(\d+)([+-]\d+)?$/i);if(!m)return null;let n=Math.min(100,+m[1]),sides=+m[2],r=roll(n,sides),extra=Number(m[3]||0);return{total:r.reduce((a,b)=>a+b,0)+extra,detail:r.join('+')+(extra?fmt(extra):'')}}function attack(i,mode='normal'){let a=ch().attacks[i],r1=roll(1,20)[0],r2=mode==='normal'?null:roll(1,20)[0],d=r2===null?r1:(mode==='adv'?Math.max(r1,r2):Math.min(r1,r2)),m=a.damage.match(/^(\d+)d(\d+)([+-]\d+)?$/i),num=Number(m[1]),sides=Number(m[2]),bonus=Number(m[3]||0),dice=roll(d===20?num*2:num,sides),total=dice.reduce((x,y)=>x+y,0)+bonus;history(`${a.name}: ${mode==='normal'?'d20 '+d:(mode==='adv'?'Vantaggio ':'Svantaggio ')+r1+'/'+r2+' → '+d} ${fmt(a.bonus)} = ${d+a.bonus}${d===1?' · FALLIMENTO AUTOMATICO':d===20?' · CRITICO':''}; danni potenziali ${total} (${dice.join('+')}${bonus?fmt(bonus):''})`)}function addResource(){let name=document.getElementById('resName').value.trim(),max=Number(document.getElementById('resMax').value);if(!name||!Number.isInteger(max)||max<1)return;ch().resources.push({name,max,current:max,recovery:document.getElementById('resRecovery').value});save();render()}function useResource(i,d){let r=ch().resources[i];r.current=Math.min(r.max,Math.max(0,r.current+d));save();render()}function removeItem(k,i){ch()[k].splice(i,1);save();render()}function deathSave(){let c=ch(),r=roll(1,20)[0];if(r===20){c.hp=1;c.deathSuccess=0;c.deathFail=0}else if(r===1)c.deathFail=Math.min(3,c.deathFail+2);else if(r>=10)c.deathSuccess=Math.min(3,c.deathSuccess+1);else c.deathFail=Math.min(3,c.deathFail+1);history('Tiro salvezza contro morte: '+r);render()}function resetDeath(){ch().deathSuccess=0;ch().deathFail=0;save();render()}function throwDice(){let n=Math.max(1,Math.min(100,Number(document.getElementById('numDice').value)||1)),s=Number(document.getElementById('dieSides').value),m=Number(document.getElementById('diceMod').value)||0,adv=document.getElementById('adv').value;let a=roll(n,s);if(s===20&&n===1&&adv!=='normal'){let b=roll(1,20)[0];a=[adv==='adv'?Math.max(a[0],b):Math.min(a[0],b)];history(`${adv==='adv'?'Vantaggio':'Svantaggio'}: ${a[0]} (altro dado ${b}) ${fmt(m)} = ${a[0]+m}`)}else history(`${n}d${s}: [${a.join(', ')}] ${fmt(m)} = ${a.reduce((x,y)=>x+y,0)+m}`);document.getElementById('diceResult').textContent=ch().history[0]}
function slot(k,prop,v){let c=ch();if(!c.slots[k])c.slots[k]={current:0,max:0};c.slots[k][prop]=Math.max(0,Number(v)||0);save()}function addSpell(){let name=document.getElementById('spellName').value.trim(),level=Number(document.getElementById('spellLevel').value),desc=document.getElementById('spellDesc').value;if(!name||level<0||level>9)return;ch().spells.push({name,level,desc});save();render()}function castSpell(i){let s=ch().spells[i];if(s.level){let slot=ch().slots[s.level];if(!slot||slot.current<1){toast('Slot insufficienti al livello selezionato');return}slot.current--}history('Incantesimo: '+s.name);render()}function addInventory(){let name=document.getElementById('itemName').value.trim(),qty=Math.max(1,Number(document.getElementById('itemQty').value)||1);if(!name)return;ch().inventory.push({name,qty});save();render()}function exportJson(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dnd-character-manager-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importJson(el){let f=el.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.characters)||!obj.characters.length||obj.characters.some(c=>!c.id||!c.name||!c.abilities||!c.inventory||!c.spells||!c.resources)){throw Error('Formato non valido')}if(!confirm('Sostituire tutti i personaggi attuali con quelli del backup?'))return;state=obj;state.selected=obj.characters.some(c=>c.id===obj.selected)?obj.selected:obj.characters[0].id;save();render();toast('Backup importato')}catch(e){toast('Impossibile importare il file')}}
const XP_TABLE=[0,300,900,2700,6500,14000,23000,34000,48000,64000,85000,100000,120000,140000,165000,195000,225000,265000,305000,355000];
function ensureV3(c){if(!c.v3)c.v3={fighter:{secondWind:1,actionSurge:1,indomitable:0},concentration:'',spellPrepared:{},spellAbility:'int',inspiration:false};return c.v3}
function fighterLimits(c){return {secondWind:1,actionSurge:c.level>=17?2:c.level>=2?1:0,indomitable:c.level>=17?3:c.level>=13?2:c.level>=9?1:0}}
function fighterPanel(c){if(!/guerriero|fighter/i.test(c.cls))return '';let f=ensureV3(c).fighter,lim=fighterLimits(c);for(let k of Object.keys(lim))f[k]=Math.min(lim[k],Math.max(0,Number(f[k]??lim[k])));return `<div class="card"><h2>Capacità del Guerriero (2014)</h2><p class="muted">Le risorse sono contate, ma il consumo di Azione Impetuosa non esegue automaticamente gli attacchi.</p><div class="grid"><div class="stat"><b>Recuperare Energie</b><p>${f.secondWind}/1</p><button onclick="fighterUse('secondWind')" ${f.secondWind<1?'disabled':''}>Usa (azione bonus)</button></div>${c.level>=2?`<div class="stat"><b>Azione Impetuosa</b><p>${f.actionSurge}/${lim.actionSurge}</p><button onclick="fighterUse('actionSurge')" ${f.actionSurge<1?'disabled':''}>Usa</button></div>`:''}${c.level>=9?`<div class="stat"><b>Indomito</b><p>${f.indomitable}/${lim.indomitable}</p><button onclick="fighterUse('indomitable')" ${f.indomitable<1?'disabled':''}>Usa</button></div>`:''}</div><p><b>Attacchi per azione:</b> ${c.level>=20?4:c.level>=11?3:c.level>=5?2:1} · <b>Attacchi con Azione Impetuosa:</b> ${2*(c.level>=20?4:c.level>=11?3:c.level>=5?2:1)} (se usi entrambe le azioni per Attaccare).</p><p class="muted">Recuperare Energie: 1d10 + livello Guerriero PF. Indomito consente di ripetere un tiro salvezza fallito, usando il nuovo risultato.</p></div>`}
function fighterUse(k){let c=ch(),f=ensureV3(c).fighter,lim=fighterLimits(c);if(!lim[k]||f[k]<1)return;f[k]--;if(k==='secondWind'){let d=roll(1,10)[0],heal=d+c.level;c.hp=Math.min(c.maxHp,c.hp+heal);history(`Recuperare Energie: d10 ${d} + livello ${c.level} = ${heal} PF`)}else history(k==='actionSurge'?'Azione Impetuosa utilizzata':'Indomito utilizzato: ripeti un tiro salvezza fallito');render()}
const oldShortRest=shortRest;shortRest=function(){oldShortRest();let c=ch();if(/guerriero|fighter/i.test(c.cls)){let f=ensureV3(c).fighter;f.secondWind=1;f.actionSurge=fighterLimits(c).actionSurge;save();render()}};
const oldLongRest=longRest;longRest=function(){oldLongRest();let c=ch();let v=ensureV3(c);v.fighter=fighterLimits(c);v.concentration='';save();render()};
function progression(c){let v=ensureV3(c),next=XP_TABLE[c.level]??null,prev=XP_TABLE[c.level-1];return `<div class="card"><h2>Progressione del personaggio</h2><div class="grid"><div class="stat"><small>Livello</small><strong>${c.level}</strong></div><div class="stat"><small>Bonus competenza</small><strong>${fmt(prof(c))}</strong></div><div class="stat"><small>Esperienza</small><strong>${Number(c.xp)||0}</strong></div></div><label>Esperienza (modifica)</label><input type="number" min="0" value="${Number(c.xp)||0}" onchange="update('xp',this.value);render()"><p>${next===null?'Livello massimo raggiunto':`Prossimo livello a ${next} PE · Mancano ${Math.max(0,next-(Number(c.xp)||0))} PE`}</p><button onclick="gainXp()">Aggiungi PE</button><button onclick="levelUp()" ${c.level>=20?'disabled':''}>Aumenta livello</button><p class="muted">Il livello si aumenta manualmente dopo aver verificato i requisiti. PF, talenti, capacità e incrementi di caratteristica richiedono conferma del giocatore.</p></div><div class="card"><h2>Guerriero — progressione 2014</h2><p>${/guerriero|fighter/i.test(c.cls)?`Attacco Extra: ${c.level>=20?4:c.level>=11?3:c.level>=5?2:1} attacchi per azione Attaccare. Azione Impetuosa: ${fighterLimits(c).actionSurge} usi per riposo breve o lungo. Indomito: ${fighterLimits(c).indomitable} usi per riposo lungo.`:'Seleziona la classe Guerriero nella scheda per vedere la progressione specifica.'}</p><p class="muted">Le capacità di sottoclasse e i privilegi non ancora automatizzati possono essere gestiti tramite Risorse e Diario.</p></div>`}
function gainXp(){let n=Number(prompt('Punti esperienza da aggiungere','300'));if(!Number.isFinite(n)||n<=0)return;ch().xp=Math.max(0,Number(ch().xp)||0)+Math.floor(n);history(`Guadagnati ${Math.floor(n)} PE`);render()}
function levelUp(){let c=ch();if(c.level>=20)return;if(!confirm(`Portare ${c.name} al livello ${c.level+1}? I PF massimi non cambiano automaticamente.`))return;c.level++;if(/guerriero|fighter/i.test(c.cls)){let f=ensureV3(c).fighter,lim=fighterLimits(c);for(let k of Object.keys(lim))if(f[k]===undefined||f[k]===0&&lim[k]>0)f[k]=lim[k]}history(`Passaggio al livello ${c.level}`);render()}
function spellOptions(c){let v=ensureV3(c);return `<div class="card"><h2>Gestione magia avanzata</h2><label>Caratteristica da incantatore</label><select onchange="ensureV3(ch()).spellAbility=this.value;save();render()">${AB.map((k,i)=>`<option value="${k}" ${v.spellAbility===k?'selected':''}>${NAMES[i]}</option>`).join('')}</select><p>CD tiro salvezza incantesimi: <b>${8+prof(c)+mod(c.abilities[v.spellAbility])}</b> · Bonus attacco incantesimi: <b>${fmt(prof(c)+mod(c.abilities[v.spellAbility]))}</b></p><label>Concentrazione attiva</label><input value="${esc(v.concentration)}" placeholder="Nessuna" onchange="ensureV3(ch()).concentration=this.value;save()"><button onclick="ensureV3(ch()).concentration='';save();render()">Termina concentrazione</button><p class="muted">Quando subisci danni, verifica manualmente il tiro salvezza di Costituzione (CD 10 o metà dei danni, se superiore).</p></div>`}
const oldCastSpell=castSpell;castSpell=function(i){let c=ch(),s=c.spells[i];if(s.level===0){history('Trucchetto: '+s.name);render();return}let available=Object.entries(c.slots).filter(([k,v])=>Number(k)>=s.level&&v.current>0).map(([k])=>Number(k)).sort((a,b)=>a-b);if(!available.length){toast('Nessuno slot di livello sufficiente');return}let chosen=Number(prompt(`Slot da consumare per ${s.name} (minimo ${s.level}). Disponibili: ${available.join(', ')}`,available[0]));if(!available.includes(chosen))return;c.slots[chosen].current--;history(`Incantesimo ${s.name} lanciato con slot di livello ${chosen}`);render()};

render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline non disponibile:',err)));
}
</script></body></html>
